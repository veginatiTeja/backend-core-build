services:
  wallet-api:
    build: .
    container_name: wallet-api
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    restart: always

  postgres:
    image: postgres:15
    container_name: wallet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: teja2026db
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: wallet-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
