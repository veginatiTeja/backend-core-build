name: Cloudwallet Backend Tests

on:
    push:
        branches:
            - development
    pull_request:
        branches:
            - development

jobs:
    test:
        name: Run Automated Tests
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Run automated tests
              run: npm test
